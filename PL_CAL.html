<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Saham Indonesia</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel untuk memproses JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        /* Custom animations similar to the original */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS COMPONENTS (Inline SVGs pengganti Lucide-React) ---
        const IconCalculator = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
        );
        const IconTrendingUp = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        );
        const IconTrendingDown = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
        );
        const IconSettings = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        );
        const IconInfo = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );
        const IconChevronDown = ({ size }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        );
        const IconChevronUp = ({ size }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        );
        const IconDollarSign = ({ size }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        );
        const IconRefreshCcw = ({ size }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        );

        // --- MAIN APP COMPONENT ---
        const App = () => {
          const [buyPrice, setBuyPrice] = useState('');
          const [sellPrice, setSellPrice] = useState('');
          const [lots, setLots] = useState('');
          
          const [buyFeePct, setBuyFeePct] = useState(0.15); 
          const [sellFeePct, setSellFeePct] = useState(0.15); 
          const [includeTax, setIncludeTax] = useState(true); 
          
          const [showSettings, setShowSettings] = useState(false);
          const [results, setResults] = useState(null);

          const formatIDR = (value) => {
            return new Intl.NumberFormat('id-ID', {
              style: 'currency',
              currency: 'IDR',
              minimumFractionDigits: 0,
              maximumFractionDigits: 0,
            }).format(value);
          };

          const formatNumber = (num) => {
            return new Intl.NumberFormat('id-ID').format(num);
          };

          useEffect(() => {
            const calculate = () => {
              const bPrice = parseFloat(buyPrice) || 0;
              const sPrice = parseFloat(sellPrice) || 0;
              const nLots = parseFloat(lots) || 0;

              if (bPrice === 0 || nLots === 0) {
                setResults(null);
                return;
              }

              const shares = nLots * 100;
              
              // 1. Hitung Modal Beli
              const grossBuyVal = bPrice * shares;
              const buyFeeVal = grossBuyVal * (buyFeePct / 100);
              const totalBuyCost = grossBuyVal + buyFeeVal;

              // 2. Hitung Hasil Jual
              const grossSellVal = sPrice * shares;
              const sellFeeBrokerVal = grossSellVal * (sellFeePct / 100);
              const sellTaxVal = includeTax ? (grossSellVal * 0.001) : 0;
              const totalSellFee = sellFeeBrokerVal + sellTaxVal;
              const netSellReceive = grossSellVal - totalSellFee;

              // 3. Profit / Loss
              const profitLoss = netSellReceive - totalBuyCost;
              const percentage = totalBuyCost > 0 ? (profitLoss / totalBuyCost) * 100 : 0;

              // 4. BEP
              const totalSellExpenseRate = (sellFeePct / 100) + (includeTax ? 0.001 : 0);
              const bepPrice = totalBuyCost / (shares * (1 - totalSellExpenseRate));
              const bepRounded = Math.ceil(bepPrice); 

              setResults({
                shares,
                grossBuyVal,
                buyFeeVal,
                totalBuyCost,
                grossSellVal,
                sellFeeBrokerVal,
                sellTaxVal,
                totalSellFee,
                netSellReceive,
                profitLoss,
                percentage,
                bepPrice: bepRounded
              });
            };

            calculate();
          }, [buyPrice, sellPrice, lots, buyFeePct, sellFeePct, includeTax]);

          const handleReset = () => {
            setBuyPrice('');
            setSellPrice('');
            setLots('');
          };

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 font-sans selection:bg-blue-100 p-4 md:p-8">
              <div className="max-w-4xl mx-auto">
                
                {/* Header */}
                <div className="flex items-center justify-between mb-6">
                  <div className="flex items-center gap-3">
                    <div className="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-200">
                      <IconCalculator className="text-white w-6 h-6" />
                    </div>
                    <div>
                      <h1 className="text-2xl font-bold text-slate-900 tracking-tight">Kalkulator Saham ID</h1>
                      <p className="text-xs text-slate-500 font-medium">Simulasi Profit/Loss & Fee Sekuritas</p>
                    </div>
                  </div>
                  <button 
                    onClick={handleReset}
                    className="text-sm text-slate-500 hover:text-blue-600 flex items-center gap-1 transition-colors bg-white px-3 py-1.5 rounded-full border border-slate-200 hover:border-blue-300 shadow-sm"
                  >
                    <IconRefreshCcw size={14} /> Reset
                  </button>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  
                  {/* Left Column: Inputs */}
                  <div className="lg:col-span-5 space-y-4">
                    
                    {/* Input Card */}
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                      <h2 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Data Transaksi</h2>
                      
                      <div className="space-y-4">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Harga Beli (Rp)</label>
                          <div className="relative">
                            <input
                              type="number"
                              value={buyPrice}
                              onChange={(e) => setBuyPrice(e.target.value)}
                              placeholder="Contoh: 5000"
                              className="w-full pl-4 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-semibold text-slate-900 placeholder:text-slate-300"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Harga Jual (Rp)</label>
                          <input
                            type="number"
                            value={sellPrice}
                            onChange={(e) => setSellPrice(e.target.value)}
                            placeholder="Contoh: 5200 (Kosongkan untuk lihat BEP)"
                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-semibold text-slate-900 placeholder:text-slate-300"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Jumlah Lot</label>
                          <div className="relative">
                            <input
                              type="number"
                              value={lots}
                              onChange={(e) => setLots(e.target.value)}
                              placeholder="Contoh: 100"
                              className="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-semibold text-slate-900 placeholder:text-slate-300"
                            />
                            <div className="absolute right-4 top-3.5 text-xs font-bold text-slate-400 pointer-events-none">LOT</div>
                          </div>
                          {results && (
                            <p className="text-xs text-slate-400 mt-1 text-right">Total: {formatNumber(results.shares)} Lembar</p>
                          )}
                        </div>
                      </div>
                    </div>

                    {/* Settings Toggle */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                      <button 
                        onClick={() => setShowSettings(!showSettings)}
                        className="w-full flex items-center justify-between p-4 text-slate-600 hover:bg-slate-50 transition-colors"
                      >
                        <div className="flex items-center gap-2">
                          <IconSettings size={18} />
                          <span className="text-sm font-medium">Pengaturan Fee Sekuritas</span>
                        </div>
                        {showSettings ? <IconChevronUp size={18} /> : <IconChevronDown size={18} />}
                      </button>
                      
                      {showSettings && (
                        <div className="p-5 border-t border-slate-100 bg-slate-50/50 space-y-4 animate-in">
                          <div className="grid grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-semibold text-slate-500 mb-1">Fee Beli (%)</label>
                              <input
                                type="number"
                                step="0.01"
                                value={buyFeePct}
                                onChange={(e) => setBuyFeePct(parseFloat(e.target.value))}
                                className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:ring-1 focus:ring-blue-500 outline-none"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-slate-500 mb-1">Fee Jual (%)</label>
                              <div className="relative group">
                                <input
                                  type="number"
                                  step="0.01"
                                  value={sellFeePct}
                                  onChange={(e) => setSellFeePct(parseFloat(e.target.value))}
                                  className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:ring-1 focus:ring-blue-500 outline-none"
                                />
                              </div>
                            </div>
                          </div>
                          
                          <div className="flex items-center gap-2">
                            <input 
                              type="checkbox" 
                              id="tax" 
                              checked={includeTax} 
                              onChange={(e) => setIncludeTax(e.target.checked)}
                              className="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"
                            />
                            <label htmlFor="tax" className="text-sm text-slate-600 cursor-pointer select-none">
                              Hitung PPh Final Penjualan (0.1%)
                            </label>
                          </div>
                          
                          <div className="p-3 bg-blue-50 border border-blue-100 rounded-lg flex gap-2">
                            <IconInfo className="text-blue-500 w-4 h-4 shrink-0 mt-0.5" />
                            <p className="text-xs text-blue-700 leading-relaxed">
                              <strong>Catatan:</strong> Fee Jual umum biasanya 0.25% (Sekuritas + Levy + PPN). 
                              Kalkulator ini menambahkan PPh 0.1% secara terpisah jika dicentang.
                            </p>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Right Column: Results */}
                  <div className="lg:col-span-7">
                    {!results ? (
                      <div className="h-full min-h-[300px] flex flex-col items-center justify-center bg-white rounded-3xl border border-slate-200 border-dashed p-8 text-center">
                        <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                          <IconTrendingUp className="text-slate-300 w-8 h-8" />
                        </div>
                        <h3 className="text-lg font-medium text-slate-600 mb-1">Belum ada data</h3>
                        <p className="text-sm text-slate-400 max-w-xs">Masukkan harga beli, harga jual, dan jumlah lot untuk melihat simulasi keuntungan.</p>
                      </div>
                    ) : (
                      <div className="space-y-4 animate-in">
                        
                        {/* Main Result Card */}
                        <div className={`relative overflow-hidden rounded-2xl p-6 text-white shadow-xl ${
                           !sellPrice ? 'bg-slate-800' :
                           results.profitLoss > 0 ? 'bg-gradient-to-br from-emerald-500 to-teal-600' : 
                           results.profitLoss < 0 ? 'bg-gradient-to-br from-rose-500 to-red-600' : 
                           'bg-slate-600'
                        }`}>
                          <div className="absolute top-0 right-0 -mt-4 -mr-4 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"></div>
                          
                          <div className="relative z-10">
                            <div className="flex items-center justify-between mb-2">
                              <span className="text-white/80 text-sm font-medium uppercase tracking-wider">
                                {!sellPrice ? 'Estimasi Modal' : results.profitLoss >= 0 ? 'Potensi Cuan' : 'Potensi Rugi'}
                              </span>
                              {sellPrice && (
                                <span className="px-2 py-1 rounded-md text-xs font-bold bg-white/20 text-white">
                                  {results.percentage >= 0 ? '+' : ''}{results.percentage.toFixed(2)}%
                                </span>
                              )}
                            </div>
                            
                            {!sellPrice ? (
                              <div>
                                 <div className="text-4xl font-bold tracking-tight mb-1">
                                  {formatIDR(results.totalBuyCost)}
                                </div>
                                <p className="text-white/70 text-sm">Total modal yang dibutuhkan.</p>
                              </div>
                            ) : (
                              <div className="flex items-end gap-3">
                                <div className="text-4xl md:text-5xl font-bold tracking-tight">
                                  {formatIDR(results.profitLoss)}
                                </div>
                              </div>
                            )}
                            
                            {/* BEP Info */}
                            <div className="mt-6 pt-4 border-t border-white/20 flex flex-wrap items-center justify-between gap-4">
                              <div>
                                <div className="text-xs text-white/70 mb-0.5">Break Even Point</div>
                                <div className="text-xl font-semibold flex items-center gap-2">
                                   {formatIDR(results.bepPrice)} 
                                   <span className="text-xs font-normal bg-white/20 px-1.5 py-0.5 rounded text-white/90">/ lembar</span>
                                </div>
                              </div>
                              {sellPrice && (
                                <div className="text-right">
                                   <div className="text-xs text-white/70 mb-0.5">Uang Bersih Diterima</div>
                                   <div className="text-lg font-semibold">{formatIDR(results.netSellReceive)}</div>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>

                        {/* Detail Stats */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          
                          {/* Modal Detail */}
                          <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-slate-800 font-bold flex items-center gap-2 mb-4">
                              <div className="w-2 h-8 bg-blue-500 rounded-full"></div>
                              Detail Pembelian
                            </h3>
                            <div className="space-y-3 text-sm">
                              <div className="flex justify-between items-center">
                                <span className="text-slate-500">Nilai Saham</span>
                                <span className="font-semibold text-slate-700">{formatIDR(results.grossBuyVal)}</span>
                              </div>
                              <div className="flex justify-between items-center">
                                <span className="text-slate-500">Fee Beli ({buyFeePct}%)</span>
                                <span className="font-medium text-red-500">+{formatIDR(results.buyFeeVal)}</span>
                              </div>
                              <div className="h-px bg-slate-100 my-2"></div>
                              <div className="flex justify-between items-center pt-1">
                                <span className="text-slate-600 font-medium">Total Modal</span>
                                <span className="font-bold text-slate-800 text-base">{formatIDR(results.totalBuyCost)}</span>
                              </div>
                              <div className="flex justify-between items-center bg-blue-50 p-2 rounded text-xs text-blue-700 mt-2">
                                <span>Avg. Price (inc. fee)</span>
                                <span className="font-bold">{formatIDR(results.totalBuyCost / results.shares)}</span>
                              </div>
                            </div>
                          </div>

                          {/* Penjualan Detail */}
                          <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-slate-800 font-bold flex items-center gap-2 mb-4">
                              <div className="w-2 h-8 bg-orange-500 rounded-full"></div>
                              Detail Penjualan
                            </h3>
                            {sellPrice ? (
                              <div className="space-y-3 text-sm">
                                <div className="flex justify-between items-center">
                                  <span className="text-slate-500">Nilai Jual</span>
                                  <span className="font-semibold text-slate-700">{formatIDR(results.grossSellVal)}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                  <span className="text-slate-500">Fee Jual ({sellFeePct}%)</span>
                                  <span className="font-medium text-red-500">-{formatIDR(results.sellFeeBrokerVal)}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                  <span className="text-slate-500">PPh Final (0.1%)</span>
                                  <span className="font-medium text-red-500">-{formatIDR(results.sellTaxVal)}</span>
                                </div>
                                <div className="h-px bg-slate-100 my-2"></div>
                                <div className="flex justify-between items-center pt-1">
                                  <span className="text-slate-600 font-medium">Terima Bersih</span>
                                  <span className="font-bold text-slate-800 text-base">{formatIDR(results.netSellReceive)}</span>
                                </div>
                              </div>
                            ) : (
                              <div className="h-full flex flex-col items-center justify-center text-slate-400 text-sm">
                                <IconTrendingDown className="mb-2 opacity-50" size={24} />
                                <p>Masukkan harga jual</p>
                              </div>
                            )}
                          </div>
                        </div>

                        {/* Summary Box */}
                        <div className="bg-white border border-slate-200 rounded-xl p-4 flex items-center justify-between text-sm">
                            <div className="flex items-center gap-2 text-slate-500">
                                <IconDollarSign size={16} />
                                <span>Total Fee & Pajak Dibayar</span>
                            </div>
                            <span className="font-bold text-slate-800">
                                {formatIDR(results.buyFeeVal + (sellPrice ? results.totalSellFee : 0))}
                            </span>
                        </div>

                      </div>
                    )}
                  </div>
                </div>
                
                <div className="mt-8 text-center text-xs text-slate-400">
                  <p>Kalkulator Saham Indonesia - Single File Version</p>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
