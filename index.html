<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nguli Hub - Workspace</title>
    <!-- Tailwind CSS untuk styling cepat dan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Warna address bar HP Android -->
    <meta name="theme-color" content="#99f6e4">
    
    <style>
        /* Efek Glassmorphism (Kaca Transparan) */
        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }
        .glass-btn:active {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(0.95);
        }
        /* Animasi masuk */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-teal-200 via-emerald-100 to-cyan-200 min-h-screen text-gray-800 font-sans antialiased pb-20">

    <!-- Header Profil -->
    <header class="pt-12 pb-8 px-4 text-center">
        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full glass mb-4 shadow-lg shadow-teal-500/20 border-2 border-white">
            <i class="fa-solid fa-helmet-safety text-5xl text-teal-600"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-teal-900 tracking-tight">Nguli Hub</h1>
        <p class="text-teal-700 mt-1 font-medium text-sm">Central Workspace & Utilities</p>
    </header>

    <!-- Kontainer Daftar Tools -->
    <main class="px-4 max-w-md mx-auto space-y-4" id="tools-container">
        <!-- List kotak preview akan dimuat secara otomatis oleh JavaScript di bawah -->
    </main>

    <script>
        /* 
         * DAFTAR TOOLS
         * Cara edit: Ganti tanda "#" pada bagian 'link' dengan URL file/web Anda.
         * Contoh: link: "https://script.google.com/macros/s/.../exec" atau link: "brankas.html"
         */
        const tools = [
            { title: "PDF Editor", desc: "Analisa & screening saham", icon: "fa-chart-line", link: "offline_pdf_editor_pro.html", color: "text-blue-600" },
            { title: "Photo Editor", desc: "Penyimpanan dokumen keluarga", icon: "fa-vault", link: "nguli_photo_editor.html", color: "text-amber-600" },
            { title: "Scanner", desc: "Scan dokumen digital", icon: "fa-print", link: "nguli_scanner_pro.html", color: "text-purple-600" },
            { title: "Kalkulator Average Down dan BEP", desc: "Edit foto praktis", icon: "fa-image", link: "Kalkulator Average Down dan BEP.html", color: "text-pink-600" },
            { title: "Kalkulator Lot Sizing", desc: "Target & laporan bulanan", icon: "fa-clipboard-list", link: "Kalkulator Lot Sizing.html", color: "text-cyan-600" },
            { title: "Smart Position Planner", desc: "PO, Surat Jalan & Opname", icon: "fa-boxes-stacked", link: "Smart Position Planner.html", color: "text-red-600" },
            { title: "Kalkulator Profit/Loss", desc: "Peminjaman antar instansi", icon: "fa-handshake", link: "PL_CAL.html", color: "text-indigo-600" }
        ];

        const container = document.getElementById('tools-container');

        // Looping untuk membuat kotak preview masing-masing tool
        tools.forEach((tool, index) => {
            const card = document.createElement('a');
            card.href = tool.link;
            // Menambahkan delay animasi bertahap (staggered)
            card.style.animationDelay = `${index * 0.05}s`;
            card.style.opacity = '0';
            card.className = "animate-fade-up block glass rounded-2xl p-4 shadow-sm hover:shadow-lg transition-all duration-300 relative overflow-hidden active:scale-[0.98]";
            
            card.innerHTML = `
                <div class="flex items-center space-x-4">
                    <div class="flex-shrink-0 w-14 h-14 rounded-xl bg-white/70 flex items-center justify-center shadow-inner border border-white">
                        <i class="fa-solid ${tool.icon} text-2xl ${tool.color}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h2 class="text-lg font-bold text-gray-900 truncate">${tool.title}</h2>
                        <p class="text-sm text-gray-600 truncate mt-0.5">${tool.desc}</p>
                    </div>
                    <div class="flex-shrink-0">
                        <div class="w-8 h-8 rounded-full glass-btn flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-chevron-right text-teal-600 text-sm"></i>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
