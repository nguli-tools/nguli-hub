<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Trader Position Manager - IDR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM, and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Mengatur font untuk konsistensi */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Menggunakan font mono untuk harga agar sejajar */
        .font-mono-price {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Komponen utama aplikasi
        const PositionPlanner = () => {
            // State Input
            const [balance, setBalance] = useState(10000000); // Default Balance 10 Juta IDR
            const [riskPercent, setRiskPercent] = useState(1);
            const [entryPrice, setEntryPrice] = useState(0);
            const [atr, setAtr] = useState(0);
            const [atrMultiplier, setAtrMultiplier] = useState(1.5); // Default 1.5x ATR untuk SL
            const [direction, setDirection] = useState('long'); // 'long' or 'short'

            // State Hasil
            const [plan, setPlan] = useState(null);

            useEffect(() => {
                calculatePlan();
            }, [balance, riskPercent, entryPrice, atr, atrMultiplier, direction]);

            const calculatePlan = () => {
                if (entryPrice <= 0 || atr <= 0) {
                    setPlan(null);
                    return;
                }

                const riskAmount = balance * (riskPercent / 100);
                const slDistance = atr * atrMultiplier;
                
                let stopLossPrice;
                let tp1, tp2, tp3;

                if (direction === 'long') {
                    stopLossPrice = entryPrice - slDistance;
                    tp1 = entryPrice + (slDistance * 1);   // 1R
                    tp2 = entryPrice + (slDistance * 2);   // 2R
                    tp3 = entryPrice + (slDistance * 3);   // 3R
                } else {
                    stopLossPrice = entryPrice + slDistance;
                    tp1 = entryPrice - (slDistance * 1);
                    tp2 = entryPrice - (slDistance * 2);
                    tp3 = entryPrice - (slDistance * 3);
                }

                // --- LOGIKA PERHITUNGAN LOT SAHAM INDONESIA (1 Lot = 100 Unit) ---
                
                // 1. Hitung total Unit (Saham) yang dapat dibeli berdasarkan risiko per unit
                // Rumus: Risk Amount / Jarak SL (dalam poin harga)
                const totalUnits = riskAmount / slDistance; 
                
                // 2. Konversi ke Lot (1 Lot = 100 unit) dan bulatkan ke bawah (floor)
                const positionSizeLots = Math.floor(totalUnits / 100);
                
                // Jika ukuran posisi 0 Lot, hentikan perhitungan.
                if (positionSizeLots <= 0) {
                    setPlan({
                        riskAmount,
                        stopLossPrice,
                        slDistance,
                        positionSizeUnits: 0, 
                        positionValue: 0,
                        targets: [] // Tidak ada target jika posisi 0
                    });
                    return;
                }

                // 3. Hitung jumlah unit yang sebenarnya (Lot * 100)
                const actualShares = positionSizeLots * 100;
                
                // 4. Hitung nilai posisi (berapa Rupiah modal yang digunakan)
                const positionValue = actualShares * entryPrice;
                
                // Gunakan positionSizeLots sebagai unit yang ditampilkan (positionSizeUnits)
                const positionSizeUnits = positionSizeLots; 

                setPlan({
                    riskAmount,
                    stopLossPrice,
                    slDistance,
                    positionSizeUnits, // Dalam satuan Lot
                    positionValue,
                    targets: [
                        { id: 1, label: 'Konservatif (1R)', price: tp1, action: 'Geser SL ke Break Even (Entry)' },
                        { id: 2, label: 'Moderat (2R)', price: tp2, action: 'Geser SL ke TP 1 (Lock Profit)' },
                        { id: 3, label: 'Agresif (3R)', price: tp3, action: 'Geser SL ke TP 2 (Trailing Ketat)' }
                    ]
                });
            };

            const formatCurrency = (val) => {
                // Formatting untuk Rupiah (IDR)
                return new Intl.NumberFormat('id-ID', { 
                    style: 'currency', 
                    currency: 'IDR', 
                    minimumFractionDigits: 0, 
                    maximumFractionDigits: 0 
                }).format(val);
            };

            const formatNumber = (val) => {
                // Tetap menggunakan maksimal 5 desimal untuk harga dan ATR
                // Lot/unit menggunakan format 0 desimal
                return new Intl.NumberFormat('en-US', { 
                    maximumFractionDigits: val % 1 === 0 ? 0 : 5 // Jika bilangan bulat (Lot), tidak ada desimal
                }).format(val);
            };

            // Ganti ikon Emoji dengan Inline SVG untuk tampilan modern
            const Icon = ({ name, className }) => {
                let pathD;
                switch (name) {
                    case 'Calculator': 
                        pathD = "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"; // Placeholder - simpler design needed
                        return (
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                                <rect x="8" y="2" width="8" height="20" rx="1" ry="1"></rect>
                                <line x1="16" y1="6" x2="8" y2="6"></line>
                                <line x1="16" y1="18" x2="8" y2="18"></line>
                                <path d="M12 10h.01"></path>
                                <path d="M12 14h.01"></path>
                                <path d="M10 12h4"></path>
                            </svg>
                        );
                    case 'Settings': 
                        return (
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.44a2 2 0 0 1-1.39 1.83l-.44.22a2 2 0 0 0-1.83 1.39v.44a2 2 0 0 1-1.83 1.39l-.22.44a2 2 0 0 0-1.39 1.83v.44a2 2 0 0 1 1.39 1.83l.22.44a2 2 0 0 0 1.83 1.39v.44a2 2 0 0 1 2 2h.44a2 2 0 0 1 2-2h.44a2 2 0 0 0 1.39-1.83l.22-.44a2 2 0 0 1 1.83-1.39v-.44a2 2 0 0 0 1.39-1.83l.44-.22a2 2 0 0 1 1.83-1.39v-.44a2 2 0 0 0-1.39-1.83l-.22-.44a2 2 0 0 1-1.83-1.39v-.44a2 2 0 0 0-2-2z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        );
                    case 'Shield': 
                        return (
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            </svg>
                        );
                    case 'Target': 
                        return (
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                                <circle cx="12" cy="12" r="10"/>
                                <circle cx="12" cy="12" r="6"/>
                                <circle cx="12" cy="12" r="2"/>
                            </svg>
                        );
                    case 'AlertTriangle': 
                        return (
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                                <line x1="12" y1="9" x2="12" y2="13"/>
                                <line x1="12" y1="17" x2="12.01" y2="17"/>
                            </svg>
                        );
                    case 'TrendingUp': 
                        return (
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                                <polyline points="17 6 23 6 23 12"/>
                            </svg>
                        );
                    case 'TrendingDown': 
                        return (
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                                <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
                                <polyline points="17 18 23 18 23 12"/>
                            </svg>
                        );
                    case 'ArrowRight': 
                        return (
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        );
                    default: return null;
                }
            };


            return (
                <div className="min-h-screen bg-gray-100 text-slate-800 p-4 md:p-8">
                    <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* Header Section */}
                        <div className="lg:col-span-12 mb-4">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="p-3 bg-blue-600 rounded-lg shadow-lg shadow-blue-300/50">
                                    <Icon name="Calculator" className="w-8 h-8 text-white stroke-2"/>
                                </div>
                                <div>
                                    <h1 className="text-3xl font-bold text-slate-900">Pro Trader Position Manager</h1>
                                    <p className="text-slate-500">Kalkulator Volatilitas & Rencana Trailing Stop</p>
                                </div>
                            </div>
                        </div>

                        {/* INPUT PANEL */}
                        <div className="lg:col-span-4 space-y-6">
                            <div className="bg-white rounded-xl p-6 border border-gray-200 shadow-xl">
                                <h2 className="text-xl font-semibold mb-6 flex items-center gap-2 text-blue-600">
                                    <Icon name="Settings" className="w-5 h-5"/> Parameter Trade
                                </h2>

                                {/* Direction Switch */}
                                <div className="grid grid-cols-2 gap-2 mb-6 bg-gray-200 p-1 rounded-lg">
                                    <button 
                                        onClick={() => setDirection('long')}
                                        className={`flex items-center justify-center gap-2 py-2 rounded-md transition-all ${direction === 'long' ? 'bg-green-600 text-white shadow-lg' : 'text-slate-600 hover:text-green-700'}`}
                                    >
                                        <Icon name="TrendingUp" className="w-4 h-4"/> Long (Buy)
                                    </button>
                                    <button 
                                        onClick={() => setDirection('short')}
                                        className={`flex items-center justify-center gap-2 py-2 rounded-md transition-all ${direction === 'short' ? 'bg-red-600 text-white shadow-lg' : 'text-slate-600 hover:text-red-700'}`}
                                    >
                                        <Icon name="TrendingDown" className="w-4 h-4"/> Short (Sell)
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {/* Account Inputs */}
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Total Modal (Balance)</label>
                                        <div className="relative">
                                            <span className="absolute left-3 top-2.5 text-slate-400">Rp</span>
                                            <input 
                                                type="number" 
                                                value={balance} 
                                                onChange={(e) => setBalance(Number(e.target.value))}
                                                className="w-full bg-white border border-gray-300 text-slate-800 rounded-lg py-2 pl-7 pr-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Resiko per Trade (%)</label>
                                            <input 
                                                type="number" 
                                                value={riskPercent} 
                                                onChange={(e) => setRiskPercent(Number(e.target.value))}
                                                className="w-full bg-white border border-gray-300 text-slate-800 rounded-lg py-2 px-3 focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">ATR Multiplier (SL)</label>
                                            <input 
                                                type="number" 
                                                step="0.1"
                                                value={atrMultiplier} 
                                                onChange={(e) => setAtrMultiplier(Number(e.target.value))}
                                                className="w-full bg-white border border-gray-300 text-slate-800 rounded-lg py-2 px-3 focus:ring-2 focus:ring-blue-500 outline-none"
                                                title="Biasanya 1.5x atau 2x nilai ATR"
                                            />
                                        </div>
                                    </div>

                                    <div className="border-t border-gray-200 my-4 pt-4">
                                        <p className="text-xs text-slate-500 mb-4 uppercase tracking-wider font-bold">Data Market Saat Ini</p>
                                        
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-500 mb-1">Harga Entry</label>
                                                <input 
                                                    type="number" 
                                                    value={entryPrice} 
                                                    onChange={(e) => setEntryPrice(Number(e.target.value))}
                                                    placeholder="Contoh: 2000"
                                                    className="w-full bg-white border border-gray-300 text-slate-800 rounded-lg py-2 px-3 focus:ring-2 focus:ring-blue-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-500 mb-1">Nilai ATR (Average True Range)</label>
                                                <input 
                                                    type="number" 
                                                    value={atr} 
                                                    onChange={(e) => setAtr(Number(e.target.value))}
                                                    placeholder="Lihat indikator ATR"
                                                    className="w-full bg-white border border-gray-300 text-slate-800 rounded-lg py-2 px-3 focus:ring-2 focus:ring-blue-500 outline-none"
                                                />
                                                <p className="text-[10px] text-slate-500 mt-1">*Ambil nilai ATR dari time frame yang anda tradingkan.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Card Filosofi */}
                            <div className="bg-blue-50 border border-blue-200 p-4 rounded-xl">
                                <h4 className="flex items-center gap-2 text-blue-600 font-semibold mb-2">
                                    <Icon name="Shield" className="w-4 h-4"/> Filosofi Volatilitas
                                </h4>
                                <p className="text-xs text-blue-700 leading-relaxed">
                                    Stop loss yang terlalu ketat pada market volatile akan sering terkena "whipsaw". Tools ini menggunakan ATR untuk memberi ruang "bernapas" pada posisi anda, sambil menyesuaikan ukuran lot agar resiko finansial tetap sama.
                                </p>
                            </div>
                        </div>

                        {/* OUTPUT PANEL */}
                        <div className="lg:col-span-8 space-y-6">
                            {!plan || plan.positionSizeUnits === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-500 border-2 border-dashed border-gray-300 rounded-xl min-h-[400px] bg-white">
                                    <Icon name="AlertTriangle" className="w-12 h-12 mb-4 opacity-50 text-3xl"/>
                                    <p>
                                        {plan && plan.positionSizeUnits === 0 
                                            ? 'Posisi 0 Lot. Resiko terlalu kecil atau Jarak SL terlalu besar.' 
                                            : 'Masukkan Harga Entry dan nilai ATR untuk melihat rencana trading.'
                                        }
                                    </p>
                                </div>
                            ) : (
                                <>
                                    {/* Top Cards: Position Sizing */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="bg-white p-5 rounded-xl border-l-4 border-red-500 shadow-md">
                                            <p className="text-slate-500 text-xs font-bold uppercase tracking-wide">Resiko Maksimal</p>
                                            <h3 className="text-2xl font-bold text-slate-900 mt-1">{formatCurrency(plan.riskAmount)}</h3>
                                            <p className="text-xs text-red-600 mt-1">Jika Stop Loss tersentuh</p>
                                        </div>

                                        <div className="bg-white p-5 rounded-xl border-l-4 border-blue-500 shadow-md">
                                            <p className="text-slate-500 text-xs font-bold uppercase tracking-wide">Ukuran Posisi (Lot)</p>
                                            <h3 className="text-2xl font-bold text-slate-900 mt-1">{formatNumber(plan.positionSizeUnits)} Lot</h3>
                                            <p className="text-xs text-blue-600 mt-1">Total Value: {formatCurrency(plan.positionValue)} ({plan.positionSizeUnits * 100} Saham)</p>
                                        </div>

                                        <div className="bg-white p-5 rounded-xl border-l-4 border-yellow-500 shadow-md">
                                            <p className="text-slate-500 text-xs font-bold uppercase tracking-wide">Stop Loss Ideal ({atrMultiplier}x ATR)</p>
                                            <h3 className="text-2xl font-bold text-yellow-600 mt-1">{formatNumber(plan.stopLossPrice)}</h3>
                                            <p className="text-xs text-yellow-700/80 mt-1">Jarak: {formatNumber(plan.slDistance)} pts</p>
                                        </div>
                                    </div>

                                    {/* Strategy Roadmap */}
                                    <div className="bg-white rounded-xl overflow-hidden shadow-xl border border-gray-200">
                                        <div className="bg-gray-50 p-4 border-b border-gray-200 flex justify-between items-center">
                                            <h3 className="font-bold text-lg flex items-center gap-2 text-slate-900">
                                                <Icon name="Target" className="w-5 h-5 text-emerald-600"/> Rencana Eksekusi (Roadmap)
                                            </h3>
                                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${direction === 'long' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                {direction === 'long' ? 'BULLISH PLAN' : 'BEARISH PLAN'}
                                            </span>
                                        </div>

                                        <div className="p-0">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="bg-gray-100 text-slate-600 text-xs uppercase">
                                                        <th className="p-4 font-semibold">Target Level</th>
                                                        <th className="p-4 font-semibold">Harga Target</th>
                                                        <th className="p-4 font-semibold">Profit (Estimasi)</th>
                                                        <th className="p-4 font-semibold text-right">Manajemen Stop Loss (Trailing)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-200">
                                                    {/* Entry Row */}
                                                    <tr className="bg-white">
                                                        <td className="p-4 text-slate-700 font-medium">ENTRY</td>
                                                        <td className="p-4 font-mono-price text-blue-600">{formatNumber(entryPrice)}</td>
                                                        <td className="p-4 text-slate-500">-</td>
                                                        <td className="p-4 text-right text-sm text-slate-600">SL Awal di <span className="text-red-600 font-bold">{formatNumber(plan.stopLossPrice)}</span></td>
                                                    </tr>

                                                    {plan.targets.map((target, index) => (
                                                        <tr key={index} className="hover:bg-gray-50 transition-colors">
                                                            <td className="p-4">
                                                                <span className={`text-sm font-bold ${index === 2 ? 'text-purple-600' : index === 1 ? 'text-emerald-600' : 'text-emerald-500'}`}>
                                                                    {target.label}
                                                                </span>
                                                            </td>
                                                            <td className="p-4 font-mono-price text-xl font-bold text-slate-900">
                                                                {formatNumber(target.price)}
                                                            </td>
                                                            <td className="p-4 text-emerald-600 font-medium">
                                                                +{formatCurrency(plan.riskAmount * (index + 1))}
                                                            </td>
                                                            <td className="p-4 text-right">
                                                                <div className="flex items-center justify-end gap-2 text-sm text-blue-700 bg-blue-100 py-2 px-3 rounded-lg border border-blue-300 inline-flex">
                                                                    <Icon name="ArrowRight" className="w-4 h-4"/>
                                                                    {target.action}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                        <div className="p-4 bg-gray-50 border-t border-gray-200 text-center">
                                            <p className="text-xs text-slate-500">
                                                *Profit estimasi adalah gross profit jika seluruh posisi ditutup di level tersebut. <br/>
                                                Disarankan melakukan <i>partial take profit</i> pada TP1 atau TP2 untuk mengamankan modal.
                                            </p>
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Render komponen ke DOM
        ReactDOM.createRoot(document.getElementById('root')).render(<PositionPlanner />);
    </script>
</body>
</html>
